<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111214" />
    <title>生成填充 · Photoshop 停靠面板</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      /* UXP shell: preserve the compact A layout and only add a reliable viewport/scroll boundary. */
      html, body { width: 100%; height: 100%; }
      body.uxp-shell { min-width: 0; min-height: 0; overflow: hidden; }
      body.uxp-shell #root {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      body.uxp-shell .prototype-stage {
        height: 100%;
        min-width: 0;
        min-height: 0;
        padding: 0;
      }
      body.uxp-shell .dock-panel {
        min-width: 0;
        height: 100%;
        min-height: 0;
      }
      body.uxp-shell .plugin-panel .panel-scroll {
        flex: 1 1 auto;
        min-height: 0;
        max-height: none;
        overflow-x: hidden;
        overflow-y: auto;
      }
      body.uxp-shell .uxp-loading {
        padding: 16px;
        color: #a1a3a8;
        font: 10px/1.4 "Segoe UI", sans-serif;
      }
    </style>
  </head>
  <body class="uxp-shell">
    <div id="root"><div class="uxp-loading">正在加载生成填充…</div></div>
    <script src="./plugin.js"></script>
  </body>
</html>
